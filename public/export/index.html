<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redirecting to export</title>
    <script>
      const target = `${window.location.origin}${window.location.pathname.replace(/\/export\/?$/, '')}/#/export${window.location.search}${window.location.hash}`
      window.location.replace(target)
    </script>
  </head>
  <body></body>
  </html>
