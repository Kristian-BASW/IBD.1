server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* ^/[^/]+/assets/.*\.(css|js|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ ^/(?<deck>[^/]+)/(?<slide>[^/]+)(?:/.*)?$ {
        try_files $uri $uri/ /$deck/$slide/index.html =404;
    }

    location ~ ^/(?<deck>[^/]+)/ {
        try_files $uri $uri/ /$deck/index.html =404;
    }
}
